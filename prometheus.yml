global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sportgid_backend
    scrape_interval: 10s
    static_configs:
      # host.docker.internal резолвится в хост-машину (работает на Mac, Windows и Linux с extra_hosts)
      - targets: ["host.docker.internal:3000"]
    metrics_path: /api/v1/metrics
    relabel_configs:
      - target_label: app
        replacement: sportgid
